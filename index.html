<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeFind — Find Local Contractors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:#1E40AF; --blue-lt:#3B82F6; --orange:#F97316; --bg:#F1F5F9;
      --white:#FFFFFF; --text:#0F172A; --muted:#64748B; --border:#E2E8F0;
      --green:#16A34A; --red:#DC2626; --yellow:#EAB308;
      --radius:10px; --shadow:0 2px 12px rgba(0,0,0,.08);
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* NAV */
    nav { background:var(--blue); color:#fff; padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.2); }
    .nav-logo { font-size:1.3rem; font-weight:800; cursor:pointer; letter-spacing:-.5px; }
    .nav-logo span { color:var(--orange); }
    .nav-links { display:flex; gap:.5rem; align-items:center; }
    .nav-links a { color:rgba(255,255,255,.85); text-decoration:none; font-size:.875rem; font-weight:500; padding:.4rem .75rem; border-radius:6px; transition:background .2s; cursor:pointer; }
    .nav-links a:hover { background:rgba(255,255,255,.15); color:#fff; }
    .nav-links a.btn-nav { background:var(--orange); color:#fff; font-weight:600; }
    .nav-links a.btn-nav:hover { background:#ea6c04; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:.4rem; padding:.6rem 1.2rem; border-radius:var(--radius); font-weight:600; font-size:.875rem; cursor:pointer; border:none; transition:all .2s; text-decoration:none; font-family:inherit; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { background:var(--blue-lt); }
    .btn-orange { background:var(--orange); color:#fff; }
    .btn-orange:hover { background:#ea6c04; }
    .btn-outline { background:transparent; color:var(--blue); border:2px solid var(--blue); }
    .btn-outline:hover { background:var(--blue); color:#fff; }
    .btn-ghost { background:#f1f5f9; color:var(--text); }
    .btn-ghost:hover { background:#e2e8f0; }
    .btn-green { background:var(--green); color:#fff; }
    .btn-green:hover { background:#15803d; }
    .btn-red { background:var(--red); color:#fff; }
    .btn-sm { padding:.4rem .8rem; font-size:.8rem; }
    .btn-xs { padding:.25rem .6rem; font-size:.75rem; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }

    /* HERO */
    .hero { background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#1d4ed8 100%); color:#fff; text-align:center; padding:5rem 2rem 4rem; }
    .hero h1 { font-size:clamp(1.8rem,5vw,3rem); font-weight:800; margin-bottom:.75rem; }
    .hero h1 span { color:var(--orange); }
    .hero p { font-size:1.1rem; opacity:.85; margin-bottom:2rem; }
    .hero-tabs { display:flex; gap:.5rem; justify-content:center; margin-bottom:1.5rem; }
    .hero-tab { background:rgba(255,255,255,.15); color:#fff; border:2px solid rgba(255,255,255,.3); border-radius:8px; padding:.5rem 1.25rem; font-weight:600; font-size:.9rem; cursor:pointer; transition:all .2s; }
    .hero-tab.active { background:#fff; color:var(--blue); border-color:#fff; }
    .hero-search { display:flex; gap:.75rem; max-width:680px; margin:0 auto; background:#fff; padding:.5rem; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.2); }
    .hero-search select,.hero-search input { flex:1; border:none; outline:none; font-size:1rem; padding:.6rem .75rem; font-family:inherit; color:var(--text); background:transparent; min-width:0; }
    .hero-search select { border-right:1px solid var(--border); }
    .hero-search button { background:var(--orange); color:#fff; border:none; border-radius:8px; padding:.7rem 1.5rem; font-weight:700; font-size:1rem; cursor:pointer; white-space:nowrap; transition:background .2s; }
    .hero-search button:hover { background:#ea6c04; }

    /* CONTAINER / SECTION */
    .container { max-width:1200px; margin:0 auto; padding:0 1.5rem; }
    .section { padding:3.5rem 0; }
    .section-title { font-size:1.5rem; font-weight:700; margin-bottom:.4rem; }
    .section-sub { color:var(--muted); margin-bottom:2rem; }

    /* TRADE GRID */
    .trade-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:1rem; }
    .trade-card { background:var(--white); border-radius:var(--radius); padding:1.25rem .75rem; text-align:center; cursor:pointer; border:2px solid transparent; transition:all .2s; box-shadow:var(--shadow); }
    .trade-card:hover { border-color:var(--blue); transform:translateY(-3px); box-shadow:0 6px 20px rgba(30,64,175,.15); }
    .trade-card .icon { font-size:2rem; display:block; margin-bottom:.5rem; }
    .trade-card .label { font-size:.8rem; font-weight:600; color:var(--text); }

    /* HOW IT WORKS */
    .how-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2rem; }
    .how-step { text-align:center; }
    .how-step .num { width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff; font-size:1.3rem; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; }
    .how-step h3 { font-size:1rem; font-weight:700; margin-bottom:.4rem; }
    .how-step p { font-size:.875rem; color:var(--muted); }

    /* STATS */
    .stats-bar { background:var(--blue); color:#fff; padding:2rem; display:flex; justify-content:center; gap:4rem; flex-wrap:wrap; }
    .stat { text-align:center; }
    .stat .num { font-size:2rem; font-weight:800; color:var(--orange); }
    .stat .label { font-size:.85rem; opacity:.85; margin-top:.2rem; }

    /* LISTINGS */
    .listings-layout { display:flex; gap:2rem; align-items:flex-start; padding:2rem 0; }
    .sidebar { width:260px; flex-shrink:0; background:var(--white); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); position:sticky; top:72px; }
    .sidebar h3 { font-size:1rem; font-weight:700; margin-bottom:1rem; }
    .filter-group { margin-bottom:1.25rem; }
    .filter-group label.group-label { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:.5rem; }
    .filter-group input[type=text],.filter-group select { width:100%; padding:.5rem .75rem; border:1px solid var(--border); border-radius:6px; font-size:.875rem; font-family:inherit; outline:none; }
    .filter-group input:focus,.filter-group select:focus { border-color:var(--blue-lt); }
    .checkbox-list { display:flex; flex-direction:column; gap:.4rem; }
    .checkbox-list label { display:flex; align-items:center; gap:.5rem; font-size:.875rem; cursor:pointer; }
    .checkbox-list input[type=checkbox] { cursor:pointer; accent-color:var(--blue); }
    .filter-group input[type=range] { width:100%; accent-color:var(--blue); }
    .range-labels { display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-top:.25rem; }
    .listings-main { flex:1; min-width:0; }
    .results-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .results-count { font-size:.9rem; color:var(--muted); }
    .sort-select { padding:.4rem .75rem; border:1px solid var(--border); border-radius:6px; font-size:.875rem; font-family:inherit; outline:none; }
    .cards-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.25rem; }

    /* CONTRACTOR CARD */
    .card { background:var(--white); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); border:2px solid transparent; position:relative; transition:all .2s; display:flex; flex-direction:column; gap:.75rem; }
    .card:hover { border-color:var(--blue-lt); box-shadow:0 6px 20px rgba(30,64,175,.12); }
    .card-featured { border-color:var(--orange); }
    .featured-badge { position:absolute; top:-1px; right:16px; background:var(--orange); color:#fff; font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:0 0 6px 6px; letter-spacing:.05em; text-transform:uppercase; }
    .card-header { display:flex; gap:.875rem; align-items:flex-start; }
    .avatar { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem; color:#fff; flex-shrink:0; position:relative; }
    .avatar-verified { position:absolute; bottom:-2px; right:-2px; background:var(--green); color:#fff; border-radius:50%; width:18px; height:18px; font-size:.65rem; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
    .card-title { flex:1; }
    .card-title h3 { font-size:1rem; font-weight:700; line-height:1.3; }
    .trade-badge { display:inline-block; font-size:.72rem; font-weight:600; padding:.15rem .5rem; border-radius:4px; margin-top:.25rem; color:#fff; }
    .card-meta { display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--muted); }
    .stars-display { display:inline-flex; gap:1px; }
    .star-f { color:var(--orange); font-size:.9rem; }
    .star-e { color:#d1d5db; font-size:.9rem; }
    .star-h { position:relative; display:inline-block; color:#d1d5db; font-size:.9rem; }
    .star-h::after { content:'★'; position:absolute; left:0; top:0; width:50%; overflow:hidden; color:var(--orange); }
    .card-desc { font-size:.85rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tags { display:flex; flex-wrap:wrap; gap:.4rem; }
    .tag { background:#f1f5f9; border-radius:4px; padding:.2rem .5rem; font-size:.72rem; font-weight:600; color:var(--muted); }
    .tag-green { background:#dcfce7; color:#15803d; }
    .card-actions { display:flex; gap:.6rem; margin-top:auto; }
    .card-actions .btn { flex:1; justify-content:center; }

    /* RESPONSE RATE BADGE */
    .response-pill { display:inline-flex; align-items:center; gap:.3rem; background:#f0fdf4; color:var(--green); font-size:.72rem; font-weight:600; padding:.2rem .5rem; border-radius:4px; }

    /* EMPTY STATE */
    .empty-state { text-align:center; padding:4rem 2rem; color:var(--muted); }
    .empty-state .big-icon { font-size:4rem; margin-bottom:1rem; }
    .empty-state h3 { font-size:1.2rem; font-weight:700; color:var(--text); margin-bottom:.5rem; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:1rem; animation:fadeIn .2s ease; }
    .modal { background:var(--white); border-radius:14px; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:slideUp .25s ease; }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    @keyframes slideUp { from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1} }
    .modal-header { padding:1.5rem 1.5rem 0; display:flex; gap:1rem; align-items:flex-start; position:relative; }
    .modal-close { position:absolute; top:1rem; right:1rem; background:var(--bg); border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:background .2s; }
    .modal-close:hover { background:var(--border); }
    .modal-body { padding:1.25rem 1.5rem 1.5rem; }
    .modal-name { font-size:1.3rem; font-weight:800; }
    .modal-meta { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin-top:.4rem; }
    .contact-bar { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
    .stats-row { display:flex; gap:1.5rem; background:var(--bg); border-radius:var(--radius); padding:1rem; margin-bottom:1rem; }
    .stat-item { text-align:center; flex:1; }
    .stat-item .val { font-size:1.3rem; font-weight:800; color:var(--blue); }
    .stat-item .lbl { font-size:.75rem; color:var(--muted); margin-top:.1rem; }
    .modal-section-title { font-size:.95rem; font-weight:700; margin:1.25rem 0 .75rem; border-top:1px solid var(--border); padding-top:1rem; }

    /* UBER-STYLE RATING BLOCK */
    .rating-overview { display:flex; gap:1.5rem; background:var(--bg); border-radius:var(--radius); padding:1.25rem; margin-bottom:1rem; }
    .rating-big { text-align:center; min-width:80px; }
    .rating-big .score { font-size:3rem; font-weight:800; color:var(--text); line-height:1; }
    .rating-big .out-of { font-size:.8rem; color:var(--muted); margin-top:.2rem; }
    .rating-big .count { font-size:.75rem; color:var(--muted); margin-top:.25rem; }
    .rating-bars { flex:1; display:flex; flex-direction:column; gap:.3rem; }
    .rating-bar-row { display:flex; align-items:center; gap:.5rem; font-size:.8rem; }
    .rating-bar-row .bar-label { width:20px; text-align:right; color:var(--muted); font-weight:600; flex-shrink:0; }
    .rating-bar-track { flex:1; background:#e2e8f0; border-radius:99px; height:8px; overflow:hidden; }
    .rating-bar-fill { height:100%; background:var(--orange); border-radius:99px; transition:width .4s ease; }
    .rating-bar-count { width:24px; color:var(--muted); font-size:.75rem; }
    .dim-ratings { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:1rem; }
    .dim-row { display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:6px; padding:.4rem .75rem; font-size:.8rem; }
    .dim-row .dim-name { color:var(--muted); }
    .dim-row .dim-score { font-weight:700; color:var(--text); display:flex; align-items:center; gap:.3rem; }

    /* REVIEW CARD */
    .review-card { background:var(--bg); border-radius:var(--radius); padding:.875rem; margin-bottom:.75rem; }
    .review-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.4rem; }
    .review-author-wrap { display:flex; align-items:center; gap:.5rem; }
    .review-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; color:#fff; flex-shrink:0; }
    .review-author { font-weight:600; font-size:.875rem; }
    .review-date { font-size:.75rem; color:var(--muted); }
    .verified-badge { display:inline-flex; align-items:center; gap:.2rem; background:#dcfce7; color:#15803d; font-size:.7rem; font-weight:700; padding:.15rem .4rem; border-radius:4px; }
    .review-comment { font-size:.85rem; color:var(--text); line-height:1.6; margin-top:.5rem; }
    .review-dims { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.5rem; }
    .review-dim-tag { font-size:.72rem; background:#eff6ff; color:var(--blue); padding:.15rem .45rem; border-radius:4px; font-weight:600; }
    .review-footer { display:flex; align-items:center; justify-content:space-between; margin-top:.6rem; padding-top:.5rem; border-top:1px solid var(--border); }
    .helpful-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:.2rem .6rem; font-size:.75rem; cursor:pointer; color:var(--muted); font-family:inherit; transition:all .2s; display:flex; align-items:center; gap:.3rem; }
    .helpful-btn:hover,.helpful-btn.voted { border-color:var(--blue); color:var(--blue); background:#eff6ff; }
    .contractor-response { background:#eff6ff; border-left:3px solid var(--blue); border-radius:0 6px 6px 0; padding:.6rem .75rem; margin-top:.5rem; }
    .contractor-response .resp-label { font-size:.72rem; font-weight:700; color:var(--blue); margin-bottom:.25rem; }
    .contractor-response p { font-size:.82rem; color:var(--text); line-height:1.5; }

    /* REVIEW FORM */
    .review-form { background:var(--bg); border-radius:var(--radius); padding:1rem; }
    .form-row { margin-bottom:.75rem; }
    .form-row label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:.3rem; }
    .form-row input,.form-row textarea,.form-row select { width:100%; padding:.6rem .75rem; border:1px solid var(--border); border-radius:6px; font-size:.875rem; font-family:inherit; outline:none; resize:vertical; }
    .form-row input:focus,.form-row textarea:focus,.form-row select:focus { border-color:var(--blue-lt); }
    .form-row.error input,.form-row.error textarea,.form-row.error select { border-color:var(--red); }
    .star-picker { display:flex; gap:.25rem; }
    .star-picker span { font-size:1.5rem; cursor:pointer; transition:transform .1s; color:#d1d5db; user-select:none; }
    .star-picker span.active { color:var(--orange); }
    .star-picker span:hover { transform:scale(1.2); }
    .dim-pickers { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:.75rem; }
    .dim-picker-row label { font-size:.75rem; font-weight:600; color:var(--muted); display:block; margin-bottom:.2rem; }
    .mini-stars { display:flex; gap:.1rem; }
    .mini-stars span { font-size:1.1rem; cursor:pointer; color:#d1d5db; transition:color .15s; user-select:none; }
    .mini-stars span.active { color:var(--orange); }

    /* POST AD FORM */
    .post-form-wrap { max-width:700px; margin:2rem auto; padding:0 1.5rem 3rem; }
    .post-form-wrap h2 { font-size:1.75rem; font-weight:800; margin-bottom:.3rem; }
    .post-form-wrap .sub { color:var(--muted); margin-bottom:2rem; }
    .form-card { background:var(--white); border-radius:var(--radius); padding:1.75rem; box-shadow:var(--shadow); margin-bottom:1.25rem; }
    .form-card h3 { font-size:1rem; font-weight:700; margin-bottom:1.25rem; color:var(--blue); border-bottom:2px solid var(--bg); padding-bottom:.75rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-grid .full { grid-column:1/-1; }
    .char-count { text-align:right; font-size:.75rem; color:var(--muted); margin-top:.25rem; }
    .tags-check { display:flex; flex-wrap:wrap; gap:.75rem; }
    .tags-check label { display:flex; align-items:center; gap:.4rem; font-size:.875rem; cursor:pointer; background:var(--bg); padding:.4rem .75rem; border-radius:6px; border:2px solid transparent; transition:all .2s; }
    .tags-check label:has(input:checked) { border-color:var(--blue); background:#eff6ff; }
    .tags-check input { cursor:pointer; accent-color:var(--blue); }
    .toggle { position:relative; width:44px; height:24px; }
    .toggle input { display:none; }
    .toggle-slider { position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:background .2s; }
    .toggle-slider::after { content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:3px; left:3px; transition:transform .2s; }
    .toggle input:checked + .toggle-slider { background:var(--orange); }
    .toggle input:checked + .toggle-slider::after { transform:translateX(20px); }

    /* JOB REQUEST FORM */
    .job-form-wrap { max-width:680px; margin:2rem auto; padding:0 1.5rem 3rem; }
    .job-form-wrap h2 { font-size:1.75rem; font-weight:800; margin-bottom:.3rem; }
    .urgency-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; }
    .urgency-opt { border:2px solid var(--border); border-radius:var(--radius); padding:.75rem .5rem; text-align:center; cursor:pointer; transition:all .2s; }
    .urgency-opt:hover { border-color:var(--blue-lt); }
    .urgency-opt.selected { border-color:var(--blue); background:#eff6ff; }
    .urgency-opt .u-icon { font-size:1.5rem; display:block; margin-bottom:.3rem; }
    .urgency-opt .u-label { font-size:.8rem; font-weight:600; }
    .urgency-opt.emergency .u-label { color:var(--red); }
    .urgency-opt.emergency.selected { border-color:var(--red); background:#fff1f2; }

    /* JOBS BOARD */
    .jobs-layout { max-width:900px; margin:0 auto; padding:2rem 1.5rem; }
    .jobs-tabs { display:flex; gap:.5rem; border-bottom:2px solid var(--border); margin-bottom:1.5rem; }
    .jobs-tab { padding:.6rem 1rem; font-weight:600; font-size:.875rem; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; color:var(--muted); transition:all .2s; }
    .jobs-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
    .job-card { background:var(--white); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); margin-bottom:1rem; border:2px solid transparent; }
    .job-card:hover { border-color:var(--border); }
    .job-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.75rem; }
    .job-title { font-size:1rem; font-weight:700; }
    .job-status { font-size:.72rem; font-weight:700; padding:.25rem .6rem; border-radius:99px; text-transform:uppercase; letter-spacing:.05em; }
    .status-open { background:#fef9c3; color:#854d0e; }
    .status-quoted { background:#dbeafe; color:#1e40af; }
    .status-hired { background:#dcfce7; color:#15803d; }
    .status-completed { background:#f1f5f9; color:#475569; }
    .status-cancelled { background:#fee2e2; color:#991b1b; }
    .job-meta { display:flex; gap:1rem; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin-bottom:.75rem; }
    .job-desc { font-size:.875rem; color:var(--muted); line-height:1.6; margin-bottom:.75rem; }
    .job-footer { display:flex; justify-content:space-between; align-items:center; }
    .quote-count { font-size:.8rem; color:var(--muted); }
    .quote-count strong { color:var(--blue); }
    .urgency-tag { display:inline-flex; align-items:center; gap:.3rem; font-size:.75rem; font-weight:700; padding:.2rem .5rem; border-radius:4px; }
    .urg-emergency { background:#fee2e2; color:#991b1b; }
    .urg-today { background:#fff7ed; color:#c2410c; }
    .urg-week { background:#fef9c3; color:#854d0e; }
    .urg-flexible { background:#f0fdf4; color:#15803d; }

    /* QUOTES PANEL */
    .quote-card { background:var(--bg); border-radius:var(--radius); padding:1rem; margin-bottom:.75rem; border:2px solid transparent; transition:border-color .2s; }

    .toast.error::before { content:'✕'; color:var(--red); font-weight:800; }

    @keyframes fadeOut { from{opacity:1}to{opacity:0} }

    /* FOOTER */

function findUserByEmail(email) { return getUsers().find(u=>u.email===email.toLowerCase()); }

function hashString(s) {
  let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i);
  return (h>>>0).toString(36);
}

function createUser({name,email,password,provider}){
  const user={id:'u'+Date.now(),name,email:email.toLowerCase(),
    passwordHash:password?hashString(password):'',
    provider:provider||'local',avatarColor:avatarColor(name),createdAt:new Date().toISOString()};
  const users=getUsers(); users.push(user); saveUsers(users); return user;
}

function requireAuth(redirectPath){
  const sess=getSession();
  if(!sess){ sessionStorage.setItem('tf_redirect',redirectPath||''); navigate('#/login'); return null; }
  return sess;
}

function seed() {
  if(!localStorage.getItem('tf_contractors')) saveContractors(SEED_CONTRACTORS);
  if(!localStorage.getItem('tf_jobs')) saveJobs(SEED_JOBS);
}

function addContractor(o) { const a=getContractors(); a.unshift(o); saveContractors(a); }
function addJob(o) { const a=getJobs(); a.unshift(o); saveJobs(a); }
function addQuote(jobId,quote) {
  const a=getJobs(); const i=a.findIndex(j=>j.id===jobId);
  if(i===-1)return; a[i].quotes=a[i].quotes||[]; a[i].quotes.push(quote);
  if(a[i].status==='open') a[i].status='quoted';
  saveJobs(a);
}
function hireContractor(jobId,quoteId) {
  const a=getJobs(); const i=a.findIndex(j=>j.id===jobId);
  if(i===-1)return; a[i].status='hired'; a[i].hiredQuoteId=quoteId; saveJobs(a);
}
function markCompleted(jobId) {
  const a=getJobs(); const i=a.findIndex(j=>j.id===jobId);
  if(i===-1)return; a[i].status='completed'; saveJobs(a);
}
function addReview(contractorId,review) {
  const a=getContractors(); const i=a.findIndex(c=>c.id===contractorId);
  if(i===-1)return;
  a[i].reviews=a[i].reviews||[]; a[i].reviews.unshift(review);
  // recalc rating
  const ratings=a[i].reviews.map(r=>r.rating);
  a[i].rating=Math.round((ratings.reduce((x,y)=>x+y,0)/ratings.length)*10)/10;
  a[i].reviewCount=ratings.length;
  saveContractors(a);
}
function voteHelpful(contractorId,reviewId) {
  const a=getContractors(); const ci=a.findIndex(c=>c.id===contractorId);
  if(ci===-1)return;
  const ri=a[ci].reviews.findIndex(r=>r.id===reviewId);
  if(ri===-1)return;
  a[ci].reviews[ri].helpful=(a[ci].reviews[ri].helpful||0)+1;
  a[ci].reviews[ri].voted=true;
  saveContractors(a);
  return a[ci].reviews[ri];
}

function tradeInfo(id){return TRADES.find(t=>t.id===id)||{label:id,icon:'🔧',color:'#475569'};}
function avatarColor(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);const c=['#1E40AF','#7C3AED','#B45309','#0891B2','#065F46','#BE185D','#1D4ED8','#92400E'];return c[Math.abs(h)%c.length];}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});}
function fmtRelDate(iso){
  if(!iso)return'';
  const diff=Date.now()-new Date(iso);
  const mins=Math.floor(diff/60000),hrs=Math.floor(diff/3600000),days=Math.floor(diff/86400000);
  if(mins<2)return'just now';if(hrs<1)return`${mins}m ago`;if(days<1)return`${hrs}h ago`;if(days<30)return`${days}d ago`;
  return fmtDate(iso);
}

function renderStarsFull(r,size=''){
  const n=Math.round(r*2)/2; let s='<span class="stars-display">';
  for(let i=1;i<=5;i++){
    if(i<=n) s+=`<span class="star-f ${size}">★</span>`;
    else if(i-0.5===n) s+=`<span class="star-h ${size}">★</span>`;
    else s+=`<span class="star-e ${size}">★</span>`;
  }
  return s+'</span>';
}

function urgencyInfo(u){
  const m={emergency:{label:'🚨 Emergency',cls:'urg-emergency'},today:{label:'⚡ Today',cls:'urg-today'},week:{label:'📅 This Week',cls:'urg-week'},flexible:{label:'🌿 Flexible',cls:'urg-flexible'}};
  return m[u]||m.flexible;
}

  return{path,params};
}

  if(!path||path==='#/'||path==='#')renderHome();
  else if(path==='#/listings')renderListings();
  else if(path==='#/post')renderPost();
  else if(path==='#/request'){if(!requireAuth('request'+(getHashParts().params.trade?'?trade='+getHashParts().params.trade:'')))return;renderJobRequest();}
  else if(path==='#/jobs')renderJobsBoard();

  else renderHome();
}

function renderListings(){
  const{params}=getHashParts();
  if(params.trade&&!filtersState.trades.includes(params.trade))filtersState.trades=[params.trade];
  if(params.location&&!filtersState.location)filtersState.location=params.location;
  let all=getContractors();
  let filtered=applyFilters(all);
  const cardsHtml=filtered.length===0
    ?`<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">🔍</div><h3>No contractors found</h3><p>Try adjusting your filters or <a href="#/post" onclick="navigate('#/post');return false;">post the first listing</a> in this category.</p></div>`
    :filtered.map(c=>renderCard(c)).join('');

  document.getElementById('app').innerHTML=`
    <div style="position:relative;">
      <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
      <aside class="sidebar" id="sidebar">
        <button class="modal-close" style="top:.5rem;right:.5rem;" onclick="closeSidebar()">✕</button>
        <h3>Filters</h3>
        <div class="filter-group">
          <label class="group-label">Trade</label>
          <div class="checkbox-list">
            ${TRADES.map(t=>`<label><input type="checkbox" value="${t.id}" ${filtersState.trades.includes(t.id)?'checked':''} onchange="onTradeFilter(this)"/>${t.icon} ${t.label}</label>`).join('')}
          </div>
        </div>
        <div class="filter-group">
          <label class="group-label">Location</label>
          <input type="text" id="loc-filter" placeholder="Suburb or city..." value="${esc(filtersState.location)}" oninput="onLocFilter(this.value)"/>
        </div>
        <div class="filter-group">
          <label class="group-label">Min Rating: <strong id="rating-val">${filtersState.minRating}</strong>★</label>
          <input type="range" min="0" max="5" step="0.5" value="${filtersState.minRating}" oninput="onRatingFilter(this.value)"/>
          <div class="range-labels"><span>Any</span><span>5★</span></div>
        </div>
        <div class="filter-group">
          <label class="group-label">Attributes</label>
          <div class="checkbox-list">
            <label><input type="checkbox" id="f-verified" ${filtersState.verified?'checked':''} onchange="onVerifiedFilter(this.checked)"/> ✓ Verified Only</label>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%;" onclick="clearFilters()">Clear Filters</button>
      </aside>
      <div class="container">
        <div class="listings-layout">
          <div style="width:260px;flex-shrink:0;display:none;" class="sidebar-placeholder"></div>
          <div class="listings-main">
            <button class="filter-toggle" onclick="openSidebar()">☰ Filters ${getActiveFilterCount()>0?`<span style="background:var(--orange);color:#fff;border-radius:99px;padding:.1rem .45rem;font-size:.7rem;">${getActiveFilterCount()}</span>`:''}</button>
            <div class="results-bar">
              <span class="results-count">Showing <strong>${filtered.length}</strong> of <strong>${all.length}</strong> contractors</span>
              <select class="sort-select" onchange="onSortChange(this.value)">
                <option value="featured" ${filtersState.sort==='featured'?'selected':''}>Featured First</option>
                <option value="rating"   ${filtersState.sort==='rating'?'selected':''}>Highest Rated</option>
                <option value="reviews"  ${filtersState.sort==='reviews'?'selected':''}>Most Reviewed</option>
                <option value="jobs"     ${filtersState.sort==='jobs'?'selected':''}>Most Jobs Done</option>
                <option value="newest"   ${filtersState.sort==='newest'?'selected':''}>Newest</option>
              </select>
            </div>
            <div class="cards-grid" id="cards-grid">${cardsHtml}</div>
          </div>
        </div>
      </div>
    </div>
  `;
  if(window.innerWidth>768){
    const s=document.getElementById('sidebar');
    const p=document.querySelector('.sidebar-placeholder');
    s.style.cssText='position:sticky;top:72px;left:0;height:auto;';
    if(p)p.style.display='block';
  }
}

function applyFilters(all){
  let f=all.filter(c=>{
    const tOk=filtersState.trades.length===0||filtersState.trades.includes(c.trade);
    const lOk=!filtersState.location||c.location.toLowerCase().includes(filtersState.location.toLowerCase());
    const rOk=(c.rating||0)>=filtersState.minRating;
    const vOk=!filtersState.verified||c.verified;
    return tOk&&lOk&&rOk&&vOk;
  });
  if(filtersState.sort==='featured') f.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||new Date(b.postedAt)-new Date(a.postedAt));
  else if(filtersState.sort==='rating') f.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(filtersState.sort==='reviews') f.sort((a,b)=>(b.reviewCount||0)-(a.reviewCount||0));
  else if(filtersState.sort==='jobs') f.sort((a,b)=>(b.completedJobs||0)-(a.completedJobs||0));
  else if(filtersState.sort==='newest') f.sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt));
  return f;
}

function getActiveFilterCount(){return(filtersState.trades.length>0?1:0)+(filtersState.location?1:0)+(filtersState.minRating>0?1:0)+(filtersState.verified?1:0);}
function onTradeFilter(el){if(el.checked){if(!filtersState.trades.includes(el.value))filtersState.trades.push(el.value);}else{filtersState.trades=filtersState.trades.filter(t=>t!==el.value);}refreshCards();}
function onLocFilter(v){filtersState.location=v;refreshCards();}
function onRatingFilter(v){filtersState.minRating=parseFloat(v);const l=document.getElementById('rating-val');if(l)l.textContent=v;refreshCards();}
function onSortChange(v){filtersState.sort=v;refreshCards();}
function onVerifiedFilter(v){filtersState.verified=v;refreshCards();}
function clearFilters(){filtersState={trades:[],location:'',minRating:0,sort:'featured',verified:false};renderListings();}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-overlay').classList.add('open');}
function closeSidebar(){const s=document.getElementById('sidebar');const o=document.getElementById('sidebar-overlay');if(s)s.classList.remove('open');if(o)o.classList.remove('open');}

function refreshCards(){
  const filtered=applyFilters(getContractors());
  const g=document.getElementById('cards-grid');
  if(!g)return;
  g.innerHTML=filtered.length===0
    ?`<div class="empty-state" style="grid-column:1/-1"><div class="big-icon">🔍</div><h3>No contractors found</h3></div>`
    :filtered.map(c=>renderCard(c)).join('');
  const rc=document.querySelector('.results-count');
  if(rc)rc.innerHTML=`Showing <strong>${filtered.length}</strong> of <strong>${getContractors().length}</strong> contractors`;
}

function renderCard(c){
  const t=tradeInfo(c.trade);
  const bg=avatarColor(c.name);
  const ini=initials(c.name);
  const tags=(c.tags||[]).slice(0,3).map(tag=>`<span class="tag">${esc(tag)}</span>`).join('');

      <div class="card-header">

        <div class="card-title">
          <h3>${esc(c.name)}</h3>

        </div>
      </div>

        <span>📍 ${esc(c.location)}</span>
        <span style="margin-left:auto;">${renderStarsFull(c.rating||0)} <span style="color:var(--muted);font-size:.8rem;margin-left:.2rem;">${c.rating||'—'} (${c.reviewCount||0})</span></span>
      </div>

        ${c.completedJobs?`<span class="tag tag-green">✓ ${c.completedJobs} jobs done</span>`:''}
        ${c.responseRate?`<span class="response-pill">⚡ ${c.responseRate}% response</span>`:''}
      </div>

let currentModalId=null;
let starRatings={overall:0,quality:0,punctuality:0,communication:0,value:0};

function openModal(id){
  currentModalId=id;
  const c=getContractors().find(x=>x.id===id);
  if(!c)return;
  const t=tradeInfo(c.trade);
  const bg=avatarColor(c.name);
  const ini=initials(c.name);
  const reviews=c.reviews||[];

  // Rating distribution
  const dist=[5,4,3,2,1].map(star=>{
    const cnt=reviews.filter(r=>Math.round(r.rating)===star).length;
    const pct=reviews.length?Math.round(cnt/reviews.length*100):0;
    return{star,cnt,pct};
  });

  // Dimension averages
  const dims=['quality','punctuality','communication','value'];
  const dimAvgs={};
  dims.forEach(d=>{
    const vals=reviews.filter(r=>r[d]).map(r=>r[d]);
    dimAvgs[d]=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
  });

  const reviewsHtml=reviews.length===0
    ?`<p style="color:var(--muted);font-size:.875rem;">No reviews yet. Be the first!</p>`
    :reviews.map(r=>renderReviewCard(r,id)).join('');

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-overlay';
  overlay.innerHTML=`
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div class="avatar" style="background:${bg};width:64px;height:64px;font-size:1.4rem;">${esc(ini)}${c.verified?'<div class="avatar-verified" style="width:22px;height:22px;font-size:.8rem;">✓</div>':''}</div>
        <div style="flex:1;">
          <div class="modal-name">${esc(c.name)}${c.verified?` <span style="background:#dcfce7;color:#15803d;font-size:.75rem;font-weight:700;padding:.15rem .4rem;border-radius:4px;vertical-align:middle;">✓ Verified</span>`:''}</div>

            <span class="trade-badge" style="background:${t.color}">${t.icon} ${t.label}</span>
            <span style="color:var(--muted);font-size:.875rem;">📍 ${esc(c.location)}</span>
          </div>
        </div>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="contact-bar">
          <a class="btn btn-primary btn-sm" href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a>
          <a class="btn btn-ghost btn-sm" href="mailto:${esc(c.email)}">✉️ Email</a>
          ${c.website?`<a class="btn btn-ghost btn-sm" href="https://${esc(c.website)}" target="_blank" rel="noopener">🌐 Website</a>`:''}
          <button class="btn btn-orange btn-sm" onclick="closeModal();navigate('#/request?contractor=${c.id}')">📋 Request Quote</button>
        </div>

        <div class="stats-row">
          <div class="stat-item"><div class="val">${c.yearsExp||'—'}</div><div class="lbl">Yrs Exp</div></div>
          <div class="stat-item"><div class="val">${c.completedJobs||0}</div><div class="lbl">Jobs Done</div></div>
          <div class="stat-item"><div class="val">${c.responseRate||'—'}%</div><div class="lbl">Response</div></div>
          <div class="stat-item"><div class="val">${reviews.length}</div><div class="lbl">Reviews</div></div>
        </div>

        <p style="font-size:.9rem;line-height:1.7;color:var(--muted);">${esc(c.description)}</p>
        ${c.tags&&c.tags.length?`<div class="tags" style="margin-top:.75rem;">${c.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div>`:''}

        ${reviews.length>0?`
        <div class="modal-section-title">Ratings & Reviews</div>
        <div class="rating-overview">
          <div class="rating-big">
            <div class="score">${c.rating||'—'}</div>
            <div>${renderStarsFull(c.rating||0)}</div>
            <div class="count">${reviews.length} review${reviews.length!==1?'s':''}</div>
          </div>
          <div class="rating-bars">
            ${dist.map(d=>`
              <div class="rating-bar-row">
                <span class="bar-label">${d.star}</span>
                <div class="rating-bar-track"><div class="rating-bar-fill" style="width:${d.pct}%"></div></div>
                <span class="rating-bar-count">${d.cnt}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="dim-ratings">
          ${dims.map(d=>`
            <div class="dim-row">
              <span class="dim-name">${d.charAt(0).toUpperCase()+d.slice(1)}</span>
              <span class="dim-score">${dimAvgs[d]!==null?`${renderStarsFull(dimAvgs[d])} <strong>${dimAvgs[d]}</strong>`:'<span style="color:var(--muted);">—</span>'}</span>
            </div>
          `).join('')}
        </div>
        `:`<div class="modal-section-title">Reviews</div>`}

        <div id="modal-reviews">${reviewsHtml}</div>

          <p style="font-size:.75rem;color:var(--muted);margin-top:.5rem;">Reviews from verified job completions are marked with a badge.</p>
        </div>
        <p style="font-size:.75rem;color:var(--muted);margin-top:.75rem;">Listed on ${fmtDate(c.postedAt)}</p>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  document.body.style.overflow='hidden';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
  starRatings={overall:0,quality:0,punctuality:0,communication:0,value:0};
}

function renderReviewCard(r,contractorId){
  const bg=avatarColor(r.author);
  const ini=r.author.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const dimTags=['quality','punctuality','communication','value']
    .filter(d=>r[d])
    .map(d=>`<span class="review-dim-tag">${d.charAt(0).toUpperCase()+d.slice(1)}: ${r[d]}★</span>`)
    .join('');
  return`
    <div class="review-card" id="rc-${esc(r.id)}">
      <div class="review-header">
        <div class="review-author-wrap">
          <div class="review-avatar" style="background:${bg}">${esc(ini)}</div>
          <div>
            <div class="review-author">${esc(r.author)}</div>
            <div style="display:flex;gap:.4rem;align-items:center;margin-top:.1rem;">
              ${renderStarsFull(r.rating)}
              <span class="review-date">${fmtDate(r.date)}</span>
              ${r.verified?'<span class="verified-badge">✓ Verified Job</span>':''}
            </div>
          </div>
        </div>
      </div>
      ${dimTags?`<div class="review-dims">${dimTags}</div>`:''}
      <div class="review-comment">${esc(r.comment)}</div>
      ${r.response?`<div class="contractor-response"><div class="resp-label">Response from contractor</div><p>${esc(r.response)}</p></div>`:''}
      <div class="review-footer">
        <button class="helpful-btn ${r.voted?'voted':''}" onclick="onHelpfulVote('${contractorId}','${r.id}',this)" ${r.voted?'disabled':''}>
          👍 Helpful (${r.helpful||0})
        </button>
        <span style="font-size:.75rem;color:var(--muted);">${r.helpful||0} found this helpful</span>
      </div>
    </div>
  `;
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function closeModal(){
  const o=document.getElementById('modal-overlay');
  if(o)o.remove();
  document.body.style.overflow='';
  currentModalId=null;
  starRatings={overall:0,quality:0,punctuality:0,communication:0,value:0};
}

function setStarDim(dim,n){
  starRatings[dim]=n;
  const picker=document.getElementById('star-picker-'+dim);
  if(!picker)return;
  picker.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('active',i<n));
}

function onHelpfulVote(contractorId,reviewId,btn){
  const updated=voteHelpful(contractorId,reviewId);
  if(!updated)return;
  btn.classList.add('voted');
  btn.disabled=true;
  btn.innerHTML=`👍 Helpful (${updated.helpful})`;
  btn.closest('.review-footer').querySelector('span').textContent=`${updated.helpful} found this helpful`;
}

function submitReview(id){
  const nameEl=document.getElementById('rf-name');
  const commentEl=document.getElementById('rf-comment');
  const nameRow=document.getElementById('rf-name-row');
  const commentRow=document.getElementById('rf-comment-row');
  let valid=true;
  if(!nameEl.value.trim()){nameRow.classList.add('error');valid=false;}else nameRow.classList.remove('error');
  if(!commentEl.value.trim()){commentRow.classList.add('error');valid=false;}else commentRow.classList.remove('error');
  if(starRatings.overall===0){showToast('Please select an overall star rating.','error');return;}
  if(!valid)return;

  const review={
    id:'r'+Date.now(),
    author:nameEl.value.trim(),
    rating:starRatings.overall,
    quality:starRatings.quality||null,
    punctuality:starRatings.punctuality||null,
    communication:starRatings.communication||null,
    value:starRatings.value||null,
    comment:commentEl.value.trim(),
    date:new Date().toISOString().split('T')[0],
    verified:false,helpful:0,voted:false,response:null,
  };
  addReview(id,review);
  showToast('Review submitted — thank you!','success');
  closeModal();
  openModal(id);
}

function selectUrgency(u){
  selectedUrgency=u;
  document.querySelectorAll('.urgency-opt').forEach(el=>el.classList.toggle('selected',el.dataset.urgency===u));
}

function submitJobRequest(){
  const fields=[{id:'jf-title',row:'jf-title-row'},{id:'jf-trade',row:'jf-trade-row'},{id:'jf-location',row:'jf-location-row'},{id:'jf-desc',row:'jf-desc-row'}];
  let valid=true;
  fields.forEach(({id,row})=>{
    const el=document.getElementById(id);
    const rowEl=document.getElementById(row);
    if(!el.value.trim()){rowEl.classList.add('error');valid=false;}else rowEl.classList.remove('error');
  });
  if(!valid){showToast('Please fill in all required fields.','error');return;}
  const sess=getSession();
  const job={
    id:'j'+Date.now(),
    title:document.getElementById('jf-title').value.trim(),
    trade:document.getElementById('jf-trade').value,
    location:document.getElementById('jf-location').value.trim(),
    description:document.getElementById('jf-desc').value.trim(),
    budget:document.getElementById('jf-budget').value.trim()||'open',
    urgency:selectedUrgency,
    customerName:sess?sess.name:'Anonymous',
    customerId:sess?sess.userId:null,
    postedAt:new Date().toISOString().split('T')[0],
    status:'open',
    quotes:[],
  };
  addJob(job);
  showToast('Job posted! Contractors will send you quotes.','success');
  setTimeout(()=>navigate('#/jobs'),500);
}

// ═══════════════════════════════════
//  JOBS BOARD
// ═══════════════════════════════════
let jobsTab='open';

function getVisibleJobs(){
  const sess=getSession();
  // Logged-in users see only their own jobs + seed jobs (customerId===null)
  // Logged-out users see only seed jobs
  return getJobs().filter(j=>j.customerId===null||(sess&&j.customerId===sess.userId));
}

function renderJobsBoard(){
  const sess=getSession();
  const jobs=getVisibleJobs();
  document.getElementById('app').innerHTML=`
    <div class="jobs-layout">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <div>
          <h2 style="font-size:1.75rem;font-weight:800;">${sess?'My Jobs':'Jobs Board'}</h2>
          <p style="color:var(--muted);margin-top:.2rem;">${sess?`Jobs posted by ${esc(sess.name.split(' ')[0])}`:'Sample jobs — <a onclick="navigate(\'#/login\')" style="color:var(--blue);font-weight:600;">sign in</a> to post your own'}</p>
        </div>
        <button class="btn btn-orange" onclick="navigate('#/request')">📋 Post a Job</button>
      </div>

      <div class="jobs-tabs">
        ${['open','quoted','hired','completed'].map(s=>`<div class="jobs-tab ${jobsTab===s?'active':''}" onclick="switchJobTab('${s}')">${s.charAt(0).toUpperCase()+s.slice(1)} <span style="background:${jobsTab===s?'var(--blue)':'var(--border)'};color:${jobsTab===s?'#fff':'var(--muted)'};border-radius:99px;padding:.1rem .4rem;font-size:.72rem;font-weight:700;margin-left:.25rem;">${jobs.filter(j=>j.status===s).length}</span></div>`).join('')}
      </div>

      <div id="jobs-list">${renderJobsList(jobs)}</div>
    </div>
  `;
}

function switchJobTab(t){
  jobsTab=t;
  const jobs=getVisibleJobs();
  document.querySelectorAll('.jobs-tab').forEach(el=>el.classList.toggle('active',el.textContent.trim().toLowerCase().startsWith(t)));
  document.getElementById('jobs-list').innerHTML=renderJobsList(jobs);
}

function renderJobsList(jobs){
  const filtered=jobs.filter(j=>j.status===jobsTab);
  if(filtered.length===0)return`<div class="empty-state"><div class="big-icon">📋</div><h3>No ${jobsTab} jobs</h3><p>Check back later or <a onclick="navigate('#/request')">post a job</a>.</p></div>`;
  return filtered.map(j=>renderJobCard(j)).join('');
}

function renderJobCard(j){
  const t=tradeInfo(j.trade); const u=urgencyInfo(j.urgency);
  const quotes=j.quotes||[];
  const hiredQuote=j.hiredQuoteId?quotes.find(q=>q.id===j.hiredQuoteId):null;
  return`
    <div class="job-card">
      <div class="job-header">
        <div>
          <div class="job-title">${esc(j.title)}</div>
          <div style="display:flex;gap:.5rem;align-items:center;margin-top:.3rem;flex-wrap:wrap;">
            <span class="trade-badge" style="background:${t.color};color:#fff;font-size:.75rem;padding:.2rem .5rem;border-radius:4px;">${t.icon} ${t.label}</span>
            <span class="urgency-tag ${u.cls}">${u.label}</span>
          </div>
        </div>
        <span class="job-status status-${j.status}">${j.status}</span>
      </div>
      <div class="job-meta">
        <span>📍 ${esc(j.location)}</span>
        <span>👤 ${esc(j.customerName)}</span>
        ${j.budget&&j.budget!=='open'?`<span>💰 ${esc(j.budget)}</span>`:''}
        <span>🕐 ${fmtRelDate(j.postedAt)}</span>
      </div>
      <div class="job-desc">${esc(j.description)}</div>

      ${quotes.length>0?`
        <div style="border-top:1px solid var(--border);padding-top:.75rem;margin-top:.25rem;">
          <div style="font-size:.85rem;font-weight:600;margin-bottom:.6rem;">💬 ${quotes.length} Quote${quotes.length!==1?'s':''} Received</div>
          ${quotes.map(q=>renderQuoteCard(q,j)).join('')}
        </div>
      `:`<div class="job-footer"><span class="quote-count">No quotes yet — <strong>be the first!</strong></span></div>`}

      ${j.status==='open'||j.status==='quoted'?`<button class="btn btn-ghost btn-sm" style="margin-top:.5rem;" onclick="openQuoteModal('${j.id}')">📩 Submit a Quote</button>`:''}
      ${j.status==='hired'&&hiredQuote?`<div style="background:#f0fdf4;border-radius:8px;padding:.75rem;margin-top:.5rem;font-size:.85rem;"><strong style="color:var(--green);">✓ Hired:</strong> ${esc(hiredQuote.contractorName)} for $${hiredQuote.price} <button class="btn btn-ghost btn-xs" style="margin-left:.5rem;" onclick="completeJob('${j.id}')">Mark Completed</button></div>`:''}
      ${j.status==='completed'?`<div style="background:#f0fdf4;border-radius:8px;padding:.75rem;margin-top:.5rem;font-size:.85rem;color:var(--green);font-weight:600;">✓ Job completed</div>`:''}
    </div>
  `;
}

function renderQuoteCard(q,j){
  const isHired=j.hiredQuoteId===q.id;
  return`
    <div class="quote-card ${isHired?'border-color:var(--green);':''}">
      <div class="quote-header">
        <div class="avatar" style="background:${avatarColor(q.contractorName)};width:36px;height:36px;font-size:.8rem;flex-shrink:0;">${initials(q.contractorName)}</div>
        <div style="flex:1;">
          <div style="font-weight:700;font-size:.9rem;">${esc(q.contractorName)}</div>
          <div style="display:flex;gap:.5rem;align-items:center;">
            ${renderStarsFull(q.rating)} <span style="font-size:.75rem;color:var(--muted);">${q.rating}</span>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="quote-price">$${q.price}</div>
          <div class="quote-eta">${esc(q.eta)}</div>
        </div>
      </div>
      <div class="quote-message">${esc(q.message)}</div>
      ${isHired?`<span style="display:inline-block;background:#dcfce7;color:var(--green);font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:4px;">✓ Hired</span>`:''}
      ${!isHired&&j.status!=='hired'&&j.status!=='completed'?`
        <div class="quote-actions">
          <button class="btn btn-green btn-sm" onclick="doHire('${j.id}','${q.id}')">✓ Accept Quote</button>
          <button class="btn btn-outline btn-sm" onclick="openModal('${q.contractorId}')">View Profile</button>
        </div>
      `:''}
    </div>
  `;
}

function doHire(jobId,quoteId){hireContractor(jobId,quoteId);showToast('Contractor hired!','success');renderJobsBoard();}
function completeJob(jobId){markCompleted(jobId);showToast('Job marked as completed.','success');renderJobsBoard();}

// ═══════════════════════════════════
//  QUOTE MODAL
// ═══════════════════════════════════
function openQuoteModal(jobId){
  const job=getJobs().find(j=>j.id===jobId);
  if(!job)return;
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modal-overlay';
  overlay.innerHTML=`
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <div style="flex:1;"><div class="modal-name">Submit a Quote</div><div style="color:var(--muted);font-size:.875rem;margin-top:.25rem;">${esc(job.title)}</div></div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row" id="qf-name-row"><label>Your Business Name *</label><input type="text" id="qf-name" placeholder="e.g. Blue River Plumbing" /></div>
        <div class="form-row" id="qf-cid-row"><label>Contractor ID (if listed on TradeFind)</label><input type="text" id="qf-cid" placeholder="Optional — links to your profile" /></div>
        <div style="display:flex;gap:1rem;">
          <div class="form-row" id="qf-price-row" style="flex:1;"><label>Your Price ($) *</label><input type="number" id="qf-price" placeholder="e.g. 250" min="1" /></div>
          <div class="form-row" style="flex:1;"><label>Availability *</label><input type="text" id="qf-eta" placeholder="e.g. Tomorrow morning" /></div>
        </div>
        <div class="form-row" id="qf-msg-row"><label>Message to Customer *</label><textarea id="qf-msg" rows="3" placeholder="Briefly describe your approach and why you're the right fit..."></textarea></div>
        <button class="btn btn-orange" style="width:100%;justify-content:center;" onclick="submitQuote('${jobId}')">Send Quote</button>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  document.body.style.overflow='hidden';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
}

function submitQuote(jobId){
  const nameEl=document.getElementById('qf-name');
  const priceEl=document.getElementById('qf-price');
  const etaEl=document.getElementById('qf-eta');
  const msgEl=document.getElementById('qf-msg');
  let valid=true;
  [[nameEl,'qf-name-row'],[priceEl,'qf-price-row'],[msgEl,'qf-msg-row']].forEach(([el,row])=>{
    const r=document.getElementById(row);
    if(!el.value.trim()){r.classList.add('error');valid=false;}else r.classList.remove('error');
  });
  if(!etaEl.value.trim()){showToast('Please enter your availability.','error');return;}
  if(!valid)return;

  const cidEl=document.getElementById('qf-cid');
  const cid=cidEl.value.trim();
  const matchedContractor=cid?getContractors().find(c=>c.id===cid):null;

  const quote={
    id:'q'+Date.now(),
    contractorId:cid||'ext',
    contractorName:nameEl.value.trim(),
    price:parseFloat(priceEl.value),
    eta:etaEl.value.trim(),
    message:msgEl.value.trim(),
    rating:matchedContractor?matchedContractor.rating:null,
    postedAt:new Date().toISOString().split('T')[0],
  };
  addQuote(jobId,quote);
  showToast('Quote submitted!','success');
  closeModal();
  renderJobsBoard();
}

function submitPost(){
  const fields=[{id:'pf-name',row:'pf-name-row'},{id:'pf-trade',row:'pf-trade-row'},{id:'pf-location',row:'pf-location-row'},{id:'pf-phone',row:'pf-phone-row'},{id:'pf-email',row:'pf-email-row'},{id:'pf-desc',row:'pf-desc-row'}];
  let valid=true;
  fields.forEach(({id,row})=>{const el=document.getElementById(id);const r=document.getElementById(row);if(!el.value.trim()){r.classList.add('error');valid=false;}else r.classList.remove('error');});
  if(!valid){showToast('Please fill in all required fields.','error');return;}
  const tags=Array.from(document.querySelectorAll('.tags-check input:checked')).map(e=>e.value);
  const contractor={
    id:'c'+Date.now(),name:document.getElementById('pf-name').value.trim(),
    trade:document.getElementById('pf-trade').value,location:document.getElementById('pf-location').value.trim(),
    phone:document.getElementById('pf-phone').value.trim(),email:document.getElementById('pf-email').value.trim(),
    website:document.getElementById('pf-website').value.trim(),
    description:document.getElementById('pf-desc').value.trim(),
    yearsExp:parseInt(document.getElementById('pf-years').value)||0,
    rating:0,reviewCount:0,reviews:[],completedJobs:0,responseRate:null,verified:false,
    tags,featured:document.getElementById('pf-featured').checked,
    postedAt:new Date().toISOString().split('T')[0],
  };
  addContractor(contractor);
  showToast('Your listing is live! Welcome to TradeFind.','success');
  filtersState={trades:[contractor.trade],location:'',minRating:0,sort:'newest'};
  setTimeout(()=>navigate('#/listings'),400);
}

// ═══════════════════════════════════
function showToast(msg,type=''){
  const root=document.getElementById('toast-root');
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
